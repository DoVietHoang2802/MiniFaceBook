<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <title>Vizo - Kết nối và chia sẻ</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
      #boot-loader { min-height: 100dvh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; background: #f8fafc; color: #475569; font: 600 14px/1.4 system-ui, sans-serif; }
      #boot-loader strong { display: flex; width: 48px; height: 48px; align-items: center; justify-content: center; border-radius: 16px; background: #7c3aed; color: #fff; font-size: 20px; box-shadow: 0 10px 25px rgba(124, 58, 237, .25); animation: boot-pulse 1s ease-in-out infinite alternate; }
      @keyframes boot-pulse { to { transform: scale(1.06); } }
    </style>
  </head>
  <body>
    <div id="root"><div id="boot-loader" role="status"><strong>V</strong><span>Đang mở Vizo...</span></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
